services:
  - type: web
    name: externalfeo-auth
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: externalfeo-db
          property: connectionString
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_TOKEN
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: DEVICE_HASH_SECRET
        generateValue: true
databases:
  - name: externalfeo-db
    plan: basic-256mb
    databaseName: externalfeo
    user: externalfeo
